<!DOCTYPE html>
<html lang="en" class="mdui-theme-auto">
<head>
  <meta charset="UTF-8">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=5.0">
  <script>
    // 在首帧渲染前同步应用主题，避免暗色模式闪白（FOUC）
    (function () {
      try {
        var saved = localStorage.getItem('mdui-theme')
        var theme = saved === 'light' || saved === 'dark' ? saved : 'auto'
        var root = document.documentElement
        root.classList.remove('mdui-theme-auto', 'mdui-theme-light', 'mdui-theme-dark')
        root.classList.add('mdui-theme-' + theme)
        root.style.colorScheme = theme === 'auto' ? 'light dark' : theme
      } catch (e) { /* localStorage 不可用时保持默认 auto */ }
    })()
  </script>
  <title>MDDocs - Open-source docs system built on mdui 2</title>
  <meta name="description" content="MDDocs is an open-source documentation system built on mdui 2, Vue, and Markdown, with localized content, sticky navigation, table of contents, and code-copy interactions.">
  <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="MDDocs - Open-source docs system built on mdui 2">
  <meta property="og:description" content="MDDocs is an open-source documentation system built on mdui 2, Vue, and Markdown, with localized content, sticky navigation, table of contents, and code-copy interactions.">
  <meta property="og:url" content="https://mddocs.bago.top/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MDDocs">
  <meta property="og:image" content="https://mddocs.bago.top/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MDDocs - Markdown-first documentation system built on mdui 2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MDDocs - Open-source docs system built on mdui 2">
  <meta name="twitter:description" content="MDDocs is an open-source documentation system built on mdui 2, Vue, and Markdown, with localized content, sticky navigation, table of contents, and code-copy interactions.">
  <meta name="twitter:image" content="https://mddocs.bago.top/og-image.png">
  <link rel="alternate" hreflang="en" href="https://mddocs.bago.top/">
  <link rel="alternate" hreflang="zh-CN" href="https://mddocs.bago.top/zh-cn/">
  <link rel="alternate" hreflang="x-default" href="https://mddocs.bago.top/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://mddocs.bago.top/">
  <!-- 正文字体自托管（src/styles/fonts.css），避免依赖 fonts.googleapis.com 这条渲染阻塞外链 -->
  <link rel="preload" href="/src/assets/fonts/Roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    :not(:defined){visibility:hidden}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
