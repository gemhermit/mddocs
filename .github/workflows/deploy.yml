name: Deploy to GitHub Pages

# 仓库默认不自动发布（避免和 Vercel / Cloudflare 等其它渠道冲突）。
# 用 GitHub Pages 发布时：先在 Settings → Pages 里把 Source 设为 GitHub Actions，
# 然后手动运行本工作流；也可以把下面注释掉的 push 触发打开，改为推 main 即发布。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # 站点主域名（canonical / hreflang / sitemap 都指向它）。
  # GitHub Pages 只是镜像部署，搜索引擎只应收录主域名这一份。
  PRIMARY_SITE_URL: https://mddocs.bago.top

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for sub-path deployment
        run: pnpm run build
        env:
          # 子路径部署：站点挂在 https://<owner>.github.io/<repo>/
          BASE_URL: /${{ github.event.repository.name }}/
          # canonical / hreflang / sitemap 一律指向主域名。
          # GitHub Pages 这份只是镜像：主域名在 Vercel，两边都自指 canonical 会变成重复内容。
          SITE_URL: ${{ env.PRIMARY_SITE_URL }}
          # 镜像副本不参与索引（GitHub Pages 不支持自定义响应头，用 robots.txt 实现）
          ROBOTS_NOINDEX: '1'

      - name: Verify prerendered output
        # 确认子路径下的每个路由都产出了 HTML，避免把半成品发到 Pages
        run: pnpm run check:docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
