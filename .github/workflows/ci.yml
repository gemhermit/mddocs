name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: lint / docs / build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22.23.4 是包含全部运行时安全补丁的最低版本，24 是当前 LTS
        node-version: ['22.23.4', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Show runtime versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check bilingual docs parity
        run: pnpm run check:docs

      - name: Check icon font subset
        # 新增图标后如果没重新子集化，这里会直接失败（否则图标会显示成字面文字）
        run: pnpm run check:icons

      - name: Build
        run: pnpm run build

      - name: Check prerendered output
        # 产物存在时，check:docs 会连预渲染页面一起校验
        run: pnpm run check:docs

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '24'
        with:
          name: dist
          path: dist
          retention-days: 7
